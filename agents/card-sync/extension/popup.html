<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Holdr Card Sync</title>
  <style>
    body { font: 13px/1.45 -apple-system, "Segoe UI", Roboto, sans-serif; width: 320px; margin: 12px; color: #1d1f27; }
    h1 { font-size: 15px; margin: 0 0 4px; }
    .tag { font-size: 11px; color: #7a5b00; background: #fff3cd; border-radius: 4px; padding: 1px 5px; }
    dl { margin: 10px 0; display: grid; grid-template-columns: 92px 1fr; gap: 4px 8px; }
    dt { color: #5b5f6e; }
    dd { margin: 0; word-break: break-word; }
    .ok { color: #13734b; }
    .bad { color: #b3261e; }
    button { font: inherit; padding: 5px 10px; border-radius: 6px; border: 1px solid #b8bcc9; background: #f3f4f8; cursor: pointer; }
    p { margin: 8px 0; color: #444857; }
  </style>
</head>
<body>
  <h1>Holdr Card Sync <span class="tag">experimental</span></h1>
  <dl>
    <dt>Receiver</dt><dd id="receiver">checking…</dd>
    <dt>Holdr</dt><dd id="holdr">–</dd>
    <dt>Waiting files</dt><dd id="outbox">–</dd>
  </dl>
  <p>On global.americanexpress.com, switch the Holdr panel ON and click Sync. The files it saves are imported in Holdr:
    Spending, Import redacted JSON.</p>
  <button id="open">Open Holdr</button>
  <p id="message"></p>
  <script src="popup.js"></script>
</body>
</html>
